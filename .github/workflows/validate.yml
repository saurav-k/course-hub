name: Validate

# Runs on every pull request into main and into prod. The first gates the
# merge that publishes to pre-production; the second gates the promotion pull
# request the captain merges to publish the live hub. So a broken link or an
# unregistered lesson never reaches either bucket.
on:
  pull_request:
    branches: [main, prod]

permissions:
  contents: read

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check course structure and links
        run: python3 scripts/validate_site.py

      # The house-standard checker has guarded part of the design system since
      # it was written and CI never ran it. It runs against a recorded baseline,
      # so it fails on a new defect rather than on the debt that predates it.
      - name: Check pages against the house standard
        run: python3 scripts/check_pages_gate.py

  # The computed-style harness is a job of its own because it needs a browser,
  # and a headless Chrome step must not be able to block a pull request that
  # only fixes a typo. It loads the sample in Chrome and compares every
  # component's computed style against the committed snapshot, so a change to
  # the stylesheet either moves nothing or says exactly what it moved.
  style:
    name: Computed style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Fail here, loudly, rather than inside the harness, if the runner image
      # ever stops shipping a browser.
      - name: Show the browser
        run: google-chrome --version

      # The harness prints its own wall-clock time on the last line, which is
      # the number to watch before more checks are added to this job.
      - name: Compare the computed style against the snapshot
        run: python3 scripts/style_snapshot.py
