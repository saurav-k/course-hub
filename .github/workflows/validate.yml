name: Validate

# Runs on every pull request into main. This is the check that gates the
# merge, so a broken link or an unregistered lesson never reaches the bucket.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check course structure and links
        run: python3 scripts/validate_site.py
