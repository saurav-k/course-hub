<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Four platforms meeting at one shared point">
  <!-- Cloud Architecture category emblem: four platform nodes joined through one
       shared centre, drawn for the Course Hub landing page. Colours are picked
       once to stay legible on both the lightest and darkest hub surfaces
       (roughly 3:1 or better against each), so one static file serves every
       mode and palette. -->
  <g stroke="#6e6a60" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="48" y1="48" x2="21" y2="21"/>
    <line x1="48" y1="48" x2="75" y2="21"/>
    <line x1="48" y1="48" x2="21" y2="75"/>
    <line x1="48" y1="48" x2="75" y2="75"/>
  </g>
  <g fill="#fdfcf8" stroke="#6e6a60" stroke-width="3">
    <rect x="10" y="10" width="24" height="24" rx="7"/>
    <rect x="62" y="62" width="24" height="24" rx="7"/>
  </g>
  <rect x="62" y="10" width="24" height="24" rx="7" fill="#1f6f74" stroke="#17545a" stroke-width="2"/>
  <rect x="10" y="62" width="24" height="24" rx="7" fill="#b8492f" stroke="#8f3823" stroke-width="2"/>
  <circle cx="48" cy="48" r="8" fill="#9c7c22" stroke="#fdfcf8" stroke-width="2.5"/>
</svg>
